server {
    listen 80;
    server_tokens off;

    # Specify the root directory for serving files
    root /usr/share/nginx/html;

    # Specify the default file to serve
    index index.html;

    # Location block for static files (optional, but can improve performance)
    # try_files checks for the file and serves it if found
    location / {
        try_files $uri $uri/ /index.html;
    }

    # You can add more location blocks for specific paths or configurations if needed.
    # For example, if you had a backend API served from the same domain prefix
    # location /api/ {
    #    proxy_pass http://your_backend_service; # This would be more complex with Fly.io inter-app communication
    # }
}