services:
  react-app:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host"]
    stdin_open: true
    tty: true
    environment:
      - VITE_API_URL=http://127.0.0.1:5000